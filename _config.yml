title: "Kostis Karampinas Photography"
name: rpk.io
myname: "Kostis Karampinas"
email: kostis.rpk@gmail.com
url: https://rpk.io
description: "Kostis Karampinas Contemporary Photography - Urban and sub-urban landscapes which emit the feeling of loneliness, abandonment and curiosity."

# jekyll-seo-tag
author:
  name: "Kostis Karampinas"
  twitter: rpk0_
logo: /images/logo.png
social:
  name: "Kostis Karampinas"
  links:
    - https://instagram.com/rpk.io
    - https://x.com/rpk0_
    - https://www.facebook.com/kostis.karampinas/
    - https://github.com/rpk0
    - https://monobloc.gr

# Key name is fixed by jekyll-seo-tag; it emits the twitter:card meta tags,
# which X still uses under that name.
twitter:
  username: rpk0_
  card: summary_large_image

# Woodworking side of the same practice; prints from here are framed there.
monobloc:
  url: https://monobloc.gr
  frames_url: https://monobloc.gr/projects/rpk.io-frames

github: rpk0
instagram: rpk.io
facebook_page: https://www.facebook.com/kostis.karampinas/

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

# Kept as-is on purpose: /posts/:title renders to /posts/<title>.html and those
# URLs are already indexed. Changing the shape would need redirects for no gain.
permalink: posts/:title

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: atom.xml

collections:
  photo_essays:
    output: true
    # :path, not :name. :name slugifies underscores to hyphens, which would move
    # every essay from /photo_essays/athens_pride/ to /photo_essays/athens-pride/
    # and 404 the indexed URLs.
    permalink: /photo_essays/:path/

defaults:
  - scope:
      path: ""
      type: photo_essays
    values:
      layout: photo_post
      section: photo_essays
  # `identifier` lights up the "posts" nav item on every post.
  - scope:
      path: ""
      type: posts
    values:
      layout: post_layout
      identifier: posts

navigation:
    - text: projects
      identity: projects
      url: /
    - text: photo essays
      identity: photo_essays
      url: /photo_essays/
    - text: posts
      url: /posts/
    - text: about
      url: /about/

exclude:
  - .jekyll-cache
  - .mise.toml
  - .ruby-lsp
  - .well-known
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - create_critiq_session.rb
  - create_external_session.rb
  - delete_critiq_session.rb
  - firebase_secret.key
  - node_modules
  - tools
  - vendor
