<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting Results Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 20px;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .session-selector {
      margin-bottom: 30px;
    }

    .session-selector h2 {
      margin: 0 0 15px 0;
      padding: 0;
      border: none;
      font-size: 20px;
      font-weight: 600;
    }

    .sessions-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .session-card {
      padding: 20px;
      background: #f9f9f9;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .session-card:hover {
      background: #f0f0f0;
      border-color: #474747;
      transform: translateY(-2px);
    }

    .session-card.active {
      background: #474747;
      color: #fff;
      border-color: #474747;
    }

    .session-card-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .session-card-id {
      font-size: 13px;
      color: #999;
      font-family: monospace;
    }

    .session-card.active .session-card-id {
      color: #ddd;
    }

    .no-sessions {
      padding: 40px;
      text-align: center;
      color: #999;
      background: #f9f9f9;
      border-radius: 8px;
      font-style: italic;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      display: none;
    }

    .results {
      display: none;
    }

    .error {
      padding: 20px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #474747;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    h2 {
      margin: 40px 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
      font-size: 24px;
    }

    .photo-results {
      display: grid;
      gap: 20px;
    }

    .photo-item {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .photo-thumbnail {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #ddd;
      flex-shrink: 0;
    }

    .photo-info {
      flex: 1;
    }

    .photo-name {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .vote-breakdown {
      display: flex;
      gap: 15px;
      font-size: 14px;
      margin-top: 8px;
    }

    .vote-breakdown-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .vote-breakdown-item.like {
      color: #4caf50;
    }

    .vote-breakdown-item.ok {
      color: #ffc107;
    }

    .vote-breakdown-item.dislike {
      color: #f44336;
    }

    .like { color: #4caf50; font-weight: bold; }
    .ok { color: #ffc107; font-weight: bold; }
    .dislike { color: #f44336; font-weight: bold; }

    .photo-votes {
      font-size: 24px;
      font-weight: 700;
      color: #4caf50;
      flex-shrink: 0;
    }

    .voters-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
      font-size: 14px;
      color: #666;
    }

    .voter-item {
      display: inline-block;
      padding: 4px 10px;
      margin: 4px;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #ddd;
    }

    .voters-section {
      margin-top: 20px;
    }

    .voter-card {
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .voter-name {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .voter-photos {
      font-size: 14px;
      color: #666;
    }

    .export-btn {
      padding: 12px 24px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 20px;
    }

    .export-btn:hover {
      background: #45a049;
    }

    @media screen and (max-width: 768px) {
      .photo-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .photo-thumbnail {
        width: 100%;
        height: 200px;
      }

      .photo-votes {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <!-- PIN Entry Modal -->
  <div id="pin-modal" class="modal" style="display: flex;">
    <div class="modal-content">
      <h2>🔒 Admin Access</h2>
      <p>Enter PIN to continue:</p>
      <input 
        type="password" 
        id="pin-input" 
        placeholder="PIN" 
        maxlength="10"
        autocomplete="off"
      />
      <button id="submit-pin" class="submit-name-btn">Access</button>
      <div id="pin-error" style="color: #f44336; margin-top: 10px; display: none; font-size: 14px;"></div>
    </div>
  </div>

  <div class="container" id="admin-content" style="display: none;">
    <h1>📊 Voting Results Admin</h1>
    <p class="subtitle">View voting results and export data</p>

    <div class="session-selector">
      <h2>Select a voting session:</h2>
      <div class="sessions-list" id="sessions-list">
        <div class="no-sessions">Loading sessions...</div>
      </div>
    </div>

    <div class="loading">Loading results...</div>
    <div class="error" id="error"></div>

    <div class="results" id="results">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="total-voters">0</div>
          <div class="stat-label">Total Voters</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-votes">0</div>
          <div class="stat-label">Total Votes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-photos">0</div>
          <div class="stat-label">Photos</div>
        </div>
      </div>

      <h2>Photos by Votes (Highest to Lowest)</h2>
      <div class="photo-results" id="photo-results"></div>

      <h2>Voters</h2>
      <div class="voters-section" id="voters-section"></div>

      <button class="export-btn" onclick="exportData()">📥 Export to JSON</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAz-cnS1BN5xS0VIZKHeKobJSyHPT9V5rU",
      authDomain: "rpk-critiq.firebaseapp.com",
      databaseURL: "https://rpk-critiq-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "rpk-critiq",
      storageBucket: "rpk-critiq.firebasestorage.app",
      messagingSenderId: "972493337470",
      appId: "1:972493337470:web:bb07a3f3596b5c863f792f"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentData = null;
    let availableSessions = [];
    const ADMIN_PIN_HASH = 'b091f49d49c6622c77ca2e0ceedec38498cde2b8';
    
    // PIN validation
    function checkPIN() {
      const pinInput = document.getElementById('pin-input');
      const pinError = document.getElementById('pin-error');
      const pin = pinInput.value.trim();
      
      if (!pin) {
        pinError.textContent = 'Please enter a PIN';
        pinError.style.display = 'block';
        return;
      }
      
      crypto.subtle.digest('SHA-1', new TextEncoder().encode(pin))
        .then(hashBuffer => {
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          
          if (hashHex === ADMIN_PIN_HASH) {
            // Correct PIN
            document.getElementById('pin-modal').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            sessionStorage.setItem('admin_auth', 'true');
            loadAvailableSessions();
          } else {
            // Wrong PIN
            pinError.textContent = 'Incorrect PIN';
            pinError.style.display = 'block';
            pinInput.value = '';
            pinInput.focus();
          }
        });
    }
    
    // Check if already authenticated
    if (sessionStorage.getItem('admin_auth') === 'true') {
      document.getElementById('pin-modal').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
    }
    
    // PIN submit handlers
    document.getElementById('submit-pin').addEventListener('click', checkPIN);
    document.getElementById('pin-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkPIN();
      }
    });

    function showError(message) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function getSessionTimestamp(sessionData) {
      let minTime = Infinity;
      
      if (sessionData.voters) {
        Object.values(sessionData.voters).forEach(v => {
          if (v.timestamp && v.timestamp < minTime) minTime = v.timestamp;
        });
      }
      
      if (sessionData.votes) {
        Object.values(sessionData.votes).forEach(photoVotes => {
          Object.values(photoVotes).forEach(v => {
            if (v.timestamp && v.timestamp < minTime) minTime = v.timestamp;
          });
        });
      }
      
      return minTime === Infinity ? 0 : minTime;
    }

    async function loadAvailableSessions() {
      try {
        const snapshot = await database.ref('sessions').once('value');
        const sessions = snapshot.val();

        if (!sessions) {
          document.getElementById('sessions-list').innerHTML = '<div class="no-sessions">No voting sessions found yet. Sessions will appear here once votes are cast.</div>';
          return;
        }

        availableSessions = Object.entries(sessions).map(([id, data]) => ({
          id,
          timestamp: getSessionTimestamp(data)
        })).sort((a, b) => b.timestamp - a.timestamp);

        displaySessionsList();
      } catch (error) {
        console.error('Error loading sessions:', error);
        // If we can't read all sessions (permission denied), show manual input
        document.getElementById('sessions-list').innerHTML = `
          <div class="no-sessions">
            <p>Cannot auto-load sessions. Enter session ID manually below:</p>
            <input type="text" id="manual-session-id" placeholder="e.g., test_dec_2025" style="width: 100%; padding: 10px; margin-top: 10px; border: 2px solid #ddd; border-radius: 6px;">
            <button onclick="loadResults(document.getElementById('manual-session-id').value)" style="margin-top: 10px; padding: 10px 20px; background: #474747; color: white; border: none; border-radius: 6px; cursor: pointer;">Load Session</button>
          </div>
        `;
      }
    }

    function displaySessionsList() {
      const listEl = document.getElementById('sessions-list');
      
      if (availableSessions.length === 0) {
        listEl.innerHTML = '<div class="no-sessions">No voting sessions found yet.</div>';
        return;
      }

      listEl.innerHTML = '';
      availableSessions.forEach(session => {
        const sessionId = session.id;
        const card = document.createElement('div');
        card.className = 'session-card';
        
        // Create a more readable title from session ID
        const title = sessionId
          .replace(/_/g, ' ')
          .replace(/\b\w/g, l => l.toUpperCase());
        
        const dateStr = session.timestamp ? new Date(session.timestamp).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'No activity';

        card.innerHTML = `
          <div class="session-card-title">${title}</div>
          <div class="session-card-id">${sessionId}</div>
          <div style="font-size: 12px; color: #888; margin-top: 5px;">Created: ${dateStr}</div>
        `;
        
        card.onclick = () => {
          // Remove active class from all cards
          document.querySelectorAll('.session-card').forEach(c => c.classList.remove('active'));
          // Add active class to clicked card
          card.classList.add('active');
          // Load results
          loadResults(sessionId);
        };
        
        listEl.appendChild(card);
      });
    }

    async function loadResults(sessionId) {
      if (!sessionId) {
        sessionId = document.querySelector('.session-card.active')?.querySelector('.session-card-id')?.textContent;
      }
      
      if (!sessionId) {
        showError('Please enter a session ID');
        return;
      }

      hideError();
      document.querySelector('.loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';

      try {
        const snapshot = await database.ref(`sessions/${sessionId}`).once('value');
        const data = snapshot.val();

        if (!data) {
          showError('No data found for this session. Make sure the session ID is correct and that there have been votes.');
          document.querySelector('.loading').style.display = 'none';
          return;
        }

        currentData = { sessionId, ...data };
        displayResults(data);
      } catch (error) {
        showError('Error loading results: ' + error.message);
        console.error(error);
      }

      document.querySelector('.loading').style.display = 'none';
    }

    function unsanitizePhotoId(id) {
      // If it looks like an extension was replaced
      if (id.endsWith('_jpg')) return id.slice(0, -4) + '.jpg';
      if (id.endsWith('_jpeg')) return id.slice(0, -5) + '.jpeg';
      if (id.endsWith('_png')) return id.slice(0, -4) + '.png';
      if (id.endsWith('_gif')) return id.slice(0, -4) + '.gif';
      if (id.endsWith('_webp')) return id.slice(0, -5) + '.webp';
      return id;
    }

    function displayResults(data) {
      const voters = data.voters || {};
      const votes = data.votes || {};

      // Calculate stats
      const totalVoters = Object.keys(voters).length;
      let totalVotes = 0;
      
      const photoVotes = {};
      Object.keys(votes).forEach(photo => {
        const photoVoters = votes[photo];
        const voteCount = Object.keys(photoVoters).length;
        totalVotes += voteCount;
        
        // Count by vote type
        const voteCounts = { like: 0, ok: 0, dislike: 0, total: voteCount };
        Object.values(photoVoters).forEach(vote => {
          if (vote.vote && voteCounts[vote.vote] !== undefined) {
            voteCounts[vote.vote]++;
          }
        });
        
        photoVotes[photo] = {
          count: voteCount,
          voters: photoVoters,
          voteCounts: voteCounts,
          originalPhotoId: Object.values(photoVoters).find(v => v.photoId)?.photoId || unsanitizePhotoId(photo)
        };
      });

      // Update stats
      document.getElementById('total-voters').textContent = totalVoters;
      document.getElementById('total-votes').textContent = totalVotes;
      document.getElementById('total-photos').textContent = Object.keys(photoVotes).length;

      // Display photos sorted by votes
      const photoResultsEl = document.getElementById('photo-results');
      photoResultsEl.innerHTML = '';

      const sortedPhotos = Object.entries(photoVotes)
        .sort((a, b) => b[1].count - a[1].count);

      sortedPhotos.forEach(([photo, data]) => {
        const photoItem = document.createElement('div');
        photoItem.className = 'photo-item';
        
        const votersList = Object.values(data.voters)
          .map(v => {
            let text = `<strong>${v.voterName}</strong> <span class="${v.vote}">${v.vote || 'vote'}</span>`;
            if (v.comment) {
              text += `<div style="margin-top: 4px; font-size: 12px; color: #555; font-style: italic; border-top: 1px solid #eee; padding-top: 2px;">"${v.comment}"</div>`;
            }
            return `<div class="voter-item" style="display: inline-block; vertical-align: top; max-width: 200px;">${text}</div>`;
          })
          .join('');

        // Get the original photo ID (with extension) for image path
        const originalPhotoId = data.originalPhotoId;
        
        // Construct image path based on session ID
        const imagePath = `/critiq/${currentData.sessionId}/${originalPhotoId}`;

        photoItem.innerHTML = `
          <a href="${imagePath}" target="_blank" style="flex-shrink: 0; display: block;">
            <img src="${imagePath}" alt="${originalPhotoId}" class="photo-thumbnail" onerror="this.style.display='none'">
          </a>
          <div class="photo-info">
            <div class="photo-name">${originalPhotoId}</div>
            <div class="vote-breakdown">
              <div class="vote-breakdown-item like">👍 ${data.voteCounts.like}</div>
              <div class="vote-breakdown-item ok">🤷 ${data.voteCounts.ok}</div>
              <div class="vote-breakdown-item dislike">👎 ${data.voteCounts.dislike}</div>
            </div>
            <div class="voters-list">${votersList}</div>
          </div>
          <div class="photo-votes">${data.count}</div>
        `;
        
        photoResultsEl.appendChild(photoItem);
      });

      // Display voters
      const votersSection = document.getElementById('voters-section');
      votersSection.innerHTML = '';

      // Build voter -> photos map
      const voterPhotos = {};
      Object.keys(votes).forEach(photo => {
        Object.entries(votes[photo]).forEach(([voterKey, voteData]) => {
          if (!voterPhotos[voterKey]) {
            voterPhotos[voterKey] = {
              name: voteData.voterName,
              photos: [],
              comments: []
            };
          }
          voterPhotos[voterKey].photos.push(photo);
          if (voteData.comment) {
             voterPhotos[voterKey].comments.push({ photo: photo, text: voteData.comment });
          }
        });
      });

      Object.entries(voterPhotos).forEach(([voterKey, data]) => {
        const voterCard = document.createElement('div');
        voterCard.className = 'voter-card';
        
        let commentsHtml = '';
        if (data.comments.length > 0) {
            commentsHtml = '<div style="margin-top: 8px; font-size: 13px;"><strong>Comments:</strong><ul style="margin-left: 20px; margin-top: 4px;">' + 
                data.comments.map(c => `<li>${c.photo}: "${c.text}"</li>`).join('') + 
                '</ul></div>';
        }

        // Create thumbnails for voted photos
        const photosHtml = data.photos.map(photo => {
            // Try to find original ID from photoVotes if available, otherwise use key
            const originalId = photoVotes[photo]?.originalPhotoId || unsanitizePhotoId(photo);
            const imagePath = `/critiq/${currentData.sessionId}/${originalId}`;
            return `<a href="${imagePath}" target="_blank" title="${originalId}"><img src="${imagePath}" style="width: 60px; height: 60px; object-fit: cover; margin: 4px; border-radius: 4px; border: 1px solid #ddd; vertical-align: middle;"></a>`;
        }).join('');

        voterCard.innerHTML = `
          <div class="voter-name">${data.name}</div>
          <div class="voter-photos">
            <div style="margin-bottom: 5px; font-size: 14px; color: #666;">Voted for:</div>
            <div style="display: flex; flex-wrap: wrap; align-items: center;">${photosHtml}</div>
          </div>
          ${commentsHtml}
        `;
        votersSection.appendChild(voterCard);
      });

      document.getElementById('results').style.display = 'block';
    }

    function exportData() {
      if (!currentData) return;

      const votes = currentData.votes || {};
      const exportList = [];

      Object.keys(votes).forEach(photoKey => {
        const photoVoters = votes[photoKey];
        const counts = { like: 0, ok: 0, dislike: 0, total: 0 };
        
        // Try to find original ID from votes
        let originalPhotoId = Object.values(photoVoters).find(v => v.photoId)?.photoId || unsanitizePhotoId(photoKey);

        Object.values(photoVoters).forEach(vote => {
          if (vote.vote && counts[vote.vote] !== undefined) {
            counts[vote.vote]++;
            counts.total++;
          }
        });

        exportList.push({
          photo: originalPhotoId,
          votes: counts
        });
      });

      // Sort by total votes descending
      exportList.sort((a, b) => b.votes.total - a.votes.total);

      const dataStr = JSON.stringify(exportList, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `voting-results-${currentData.sessionId}-${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    // Load available sessions on page load (only if authenticated)
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('admin_auth') === 'true') {
        loadAvailableSessions();
      }
      // Focus PIN input
      document.getElementById('pin-input')?.focus();
    });
  </script>
</body>
</html>
